.tbs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}

.sg{display:grid;gap:8px;margin-bottom:10px}.s3{grid-template-columns:repeat(3,1fr)}.s4{grid-template-columns:repeat(4,1fr)}
.sb{background:var(--bg);border-radius:4px;padding:6px;text-align:center}
.sv{font-size:13px;font-weight:700;font-family:Menlo,monospace}
.sl{font-size:9px;color:var(--mt);text-transform:uppercase;letter-spacing:.05em}
.ap{background:#fef3c7;border-radius:6px;padding:10px;border:1px solid #fcd34d;margin-bottom:6px}
.apt{font-size:10px;font-weight:700;color:#92400e;margin-bottom:4px;letter-spacing:.05em}
.apb{font-size:12px;color:#78350f;line-height:1.4;margin-bottom:3px}
.ah{background:#dbeafe;border-radius:6px;padding:10px;border:1px solid #93c5fd;margin-bottom:6px}

.agt{font-size:10px;font-weight:700;color:#166534;margin-bottom:4px;letter-spacing:.05em}
.agb{font-size:12px;color:#14532d;line-height:1.4;margin-bottom:3px}
.ar{background:#fee2e2;border-radius:6px;padding:10px;border:1px solid #fca5a5;margin-bottom:6px}
.art{font-size:10px;font-weight:700;color:#991b1b;margin-bottom:4px;letter-spacing:.05em}
.arb{font-size:12px;color:#7f1d1d;line-height:1.4;margin-bottom:3px}
.hs{display:flex;gap:1px;align-items:flex-end;height:22px}
.sh{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;margin-top:16px}
.it{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.itg{padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600;background:var(--acb);color:var(--ac)}
.og{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.os{text-align:center}.ov{font-size:18px;font-weight:700;font-family:Menlo,monospace}
.ov.hi{color:var(--rd)}.ov.lo{color:var(--gn)}
.ol{font-size:9px;color:var(--mt);text-transform:uppercase;letter-spacing:.05em}
.sn{font-size:12px;line-height:1.4;margin-bottom:4px}.snh{color:#92400e}.snp{color:#1e40af}
.nm{font-size:11px;color:var(--mt);margin-bottom:10px}
.ib{margin-top:10px;padding:8px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;font-size:12px;color:var(--mt);line-height:1.4}
.ft{padding:16px;text-align:center;font-size:10px;color:var(--mt)}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.an{animation:fi .25s ease-out}
</style>
</head>

t.b.forEach(function(b,i){var l=tl(b),o=eH===i,tg=hT(b),ad=hA(b),ht=t.gl[b.P];
h+='<div class="cd"><div class="ch" onclick="xH('+i+')"><div class="jy">'+b.N+'</div><div class="ci"><div class="cn">'+b.P+' '+thH(l)+'</div><div class="cs">'+b.AVG.toFixed(3)+'/'+b.OBP.toFixed(3)+'/'+b.SLG.toFixed(3)+' \xB7 '+b.PA+'PA \xB7 '+b.HR+'HR \xB7 '+b.RBI+'RBI</div></div><div class="ca'+(o?' o':'')+'">&#9662;</div></div>';
h+='<div class="cb'+(o?' o an':'')+'"><div class="tgs">'+tgH(tg)+'</div>'+hsH(ht);
h+='<div class="sg s4"><div class="sb"><div class="sv">'+b.OPS.toFixed(3)+'</div><div class="sl">OPS</div></div><div class="sb"><div class="sv">'+b.FPS.toFixed(0)+'%</div><div class="sl">1st Pitch Swing</div></div><div class="sb"><div class="sv">'+b.HH.toFixed(0)+'%</div><div class="sl">Hard Hit%</div></div><div class="sb"><div class="sv">'+(b.PA>0?(b.BB/b.PA*100).toFixed(0):0)+'%</div><div class="sl">Walk Rate</div></div></div>';
h+='<div class="sg s4"><div class="sb"><div class="sv">'+b.HR+'</div><div class="sl">HR</div></div><div class="sb"><div class="sv">'+b.B2+'</div><div class="sl">2B</div></div><div class="sb"><div class="sv">'+(b.PA>0?(b.SO/b.PA*100).toFixed(0):0)+'%</div><div class="sl">K Rate</div></div><div class="sb"><div class="sv">'+b.HBP+'</div><div class="sl">HBP</div></div></div>';
if(ad.length)h+='<div class="ap"><div class="apt">\u26BE PITCHING PLAN</div>'+ad.map(function(a){return '<div class="apb">'+a+'</div>'}).join('')+'</div>';
h+='</div></div>'});return h}

// Pitchers tab
function rP(){
var t=D[cK],h='<div class="nm">Sorted by BF \xB7 Tap for scouting card</div>';
t.p.forEach(function(p,i){var o=eP===i,tg=pT(p),cmd=pCmd(p),str=pStr(p),exp=pExp(p);
h+='<div class="cd"><div class="ch" onclick="xP('+i+')"><div class="jy">'+p.N+'</div><div class="ci"><div class="cn">'+p.P+'</div><div class="cs">'+p.IP+'IP \xB7 '+p.ERA.toFixed(2)+'ERA \xB7 '+p.SO+'K/'+p.BB+'BB \xB7 '+p.PBF.toFixed(1)+' P/BF \xB7 '+p.G+'G</div></div><div class="ca'+(o?' o':'')+'">&#9662;</div></div>';
h+='<div class="cb'+(o?' o an':'')+'"><div class="tgs">'+tgH(tg)+'</div>';
h+='<div class="sg s3"><div class="sb"><div class="sv">'+(p.Spct>0?p.Spct.toFixed(0)+'%':'\u2014')+'</div><div class="sl">Strike%</div></div><div class="sb"><div class="sv">'+p.FPS.toFixed(0)+'%</div><div class="sl">FPS%</div></div><div class="sb"><div class="sv">'+Math.round(p.BB/p.BF*100)+'%</div><div class="sl">BB%</div></div></div>';
h+='<div class="sg s3"><div class="sb"><div class="sv">'+p.PBF.toFixed(1)+'</div><div class="sl">P/BF</div></div><div class="sb"><div class="sv">'+p.HHp.toFixed(0)+'%</div><div class="sl">HH% Against</div></div><div class="sb"><div class="sv">'+p.GB+'/'+p.AO+'</div><div class="sl">GB/FO</div></div></div>';
if(cmd.length)h+='<div class="ah"><div class="aht">\u{1F3AF} COMMAND & CONTROL</div>'+cmd.map(function(a){return '<div class="ahb">'+a+'</div>'}).join('')+'</div>';
if(str.length)h+='<div class="ag"><div class="agt">\u{1F4AA} HOW HE SUCCEEDS</div>'+str.map(function(a){return '<div class="agb">'+a+'</div>'}).join('')+'</div>';
if(exp.length)h+='<div class="ar"><div class="art">\u{1F3AF} HOW TO BEAT HIM</div>'+exp.map(function(a){return '<div class="arb">'+a+'</div>'}).join('')+'</div>';
h+='</div></div>'});return h}

function R(){
var t=D[cK];
document.getElementById('tn').textContent=t.n;
document.getElementById('tsu').textContent=t.g+' games';
document.getElementById('tbs').innerHTML=Object.keys(D).filter(function(k){return k!=='_ts'}).map(function(k){return '<button class="tb'+(k===cK?' a':'')+'" onclick="sK(\''+k+'\')">'+D[k].s+'</button>'}).join('');
document.querySelectorAll('.tab').forEach(function(x){x.className='tab'+(x.textContent.toLowerCase()===cB?' a':'')});
document.getElementById('ct').innerHTML=cB==='overview'?rOv():cB==='hitters'?rH():rP();
document.getElementById('ft').textContent='Generated '+D._ts;
}
function sK(k){cK=k;eH=null;eP=null;R()}
function sT(v){cB=v;eH=null;eP=null;R()}
function xH(i){eH=eH===i?null:i;R()}
function xP(i){eP=eP===i?null:i;R()}
R();
</script></body></html>
